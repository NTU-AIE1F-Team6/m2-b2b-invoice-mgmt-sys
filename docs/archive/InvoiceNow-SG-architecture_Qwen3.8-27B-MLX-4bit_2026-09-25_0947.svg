<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1032" viewBox="0 0 1600 1032" role="img" aria-labelledby="t d">
  <title id="t">InvoiceNow SG — Technical Architecture</title>
  <desc id="d">React 18 plus Vite single-page application simulating the Singapore Peppol e-invoicing network. Three runtime bands (presentation, application logic, client-side data access) inside the user's browser; simulated Peppol Access Point and live keyless APIs on the right; static hosting and build pipeline at the bottom. No backend: state is persisted in the browser.</desc>
  <defs>
    <marker id="arw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#4a5d75"/>
    </marker>
    <style>
      text{font-family:Arial,'Helvetica Neue',Helvetica,sans-serif}
      .t-title{font-size:28px;font-weight:700;fill:#10203a}
      .t-sub{font-size:15px;fill:#5c6d82}
      .t-sec{font-size:12px;font-weight:700;letter-spacing:1.4px;fill:#6b7c90}
      .t-h{font-size:15px;font-weight:700;fill:#17293f}
      .t-b{font-size:13px;fill:#46586d}
      .t-bs{font-size:12.5px;fill:#46586d}
      .t-s{font-size:11.5px;fill:#6b7c90}
      .t-tag{font-size:12.5px;font-weight:700;letter-spacing:1.2px;fill:#33506e}
      .t-lbl{font-size:11.5px;font-weight:600;fill:#54677e}
      .t-chip{font-size:11px;font-weight:700}
      .a{stroke:#4a5d75;stroke-width:1.6;fill:none}
    </style>
  </defs>

  <rect width="1600" height="1032" fill="#ffffff"/>

  <!-- Header -->
  <text x="48" y="58" class="t-title">InvoiceNow SG — Technical Architecture</text>
  <text x="48" y="86" class="t-sub">React 18 + Vite single-page application · simulation of Singapore's Peppol e-invoicing (InvoiceNow) network · NTU AI Engineering, Module 2</text>
  <rect x="1180" y="36" width="372" height="46" rx="12" fill="#eef4fb" stroke="#c9d8ea"/>
  <text x="1366" y="65" text-anchor="middle" class="t-tag">STATIC SPA · CLIENT-SIDE STATE · NO BACKEND</text>

  <!-- ======================= LEFT COLUMN ======================= -->
  <text x="48" y="158" class="t-sec">VERIFICATION</text>
  <rect x="48" y="170" width="352" height="126" rx="10" fill="#f7f9fc" stroke="#d5dfe8"/>
  <text x="62" y="196" class="t-h">Playwright smoke test</text>
  <text x="62" y="220" class="t-b">scripts/smoke_test.py — headless Chromium</text>
  <text x="62" y="240" class="t-b">login gate · wrong-password rejection · dashboard</text>
  <text x="62" y="260" class="t-b">asserts seeded invoices · no console errors</text>
  <text x="62" y="282" class="t-s">run against: npm run preview build</text>

  <text x="48" y="334" class="t-sec">ALTERNATE DELIVERY</text>
  <rect x="48" y="346" width="352" height="88" rx="10" fill="#f7f9fc" stroke="#d5dfe8" stroke-dasharray="5 4"/>
  <text x="62" y="372" class="t-h">Vercel (optional target)</text>
  <text x="62" y="396" class="t-b">vercel.json — SPA rewrites to index.html</text>
  <text x="62" y="418" class="t-b">no per-route folders needed there</text>

  <text x="48" y="472" class="t-sec">PROJECT DOCS</text>
  <rect x="48" y="484" width="352" height="112" rx="10" fill="#f7f9fc" stroke="#d5dfe8"/>
  <text x="62" y="510" class="t-h">docs/ — shared design artefacts</text>
  <text x="62" y="534" class="t-b">PRD + architecture (requirements/)</text>
  <text x="62" y="554" class="t-b">planning · handoffs · task lists</text>
  <text x="62" y="578" class="t-s">this diagram → docs/design/</text>

  <!-- ======================= CENTRE: BROWSER SPA ======================= -->
  <rect x="448" y="140" width="632" height="700" rx="14" fill="#fcfdff" stroke="#8fb0d1" stroke-width="1.5"/>
  <text x="472" y="172" class="t-sec">USER'S BROWSER — REACT SPA RUNTIME</text>
  <text x="1056" y="172" text-anchor="end" class="t-s">React 18 · Vite · Tailwind 4 · React Router 6</text>

  <!-- Band A: presentation -->
  <rect x="472" y="186" width="584" height="166" rx="10" fill="#eef4fb" stroke="#c3d4e6"/>
  <text x="486" y="208" class="t-sec">PRESENTATION</text>
  <rect x="486" y="220" width="278" height="120" rx="8" fill="#ffffff" stroke="#d3ddea"/>
  <text x="500" y="244" class="t-h">Pages — 7 routes</text>
  <text x="500" y="268" class="t-b">Public: Login · Tour (concept cards)</text>
  <text x="500" y="288" class="t-b">Protected: Dashboard · Create · Edit</text>
  <text x="500" y="308" class="t-b">Customers · Products · * → Dashboard</text>
  <rect x="774" y="220" width="268" height="120" rx="8" fill="#ffffff" stroke="#d3ddea"/>
  <text x="788" y="244" class="t-h">Reusable components</text>
  <text x="788" y="268" class="t-b">AppShell · Navbar · RequireAuth guard</text>
  <text x="788" y="288" class="t-b">InvoiceForm — controlled inputs · UEN</text>
  <text x="788" y="308" class="t-b">InvoiceList · InvoiceCard · StatCards</text>
  <text x="788" y="328" class="t-b">FxRatesCard · SearchFilter · Toast · Hint</text>

  <path class="a" d="M 625 352 V 368" marker-end="url(#arw)"/>
  <path class="a" d="M 908 352 V 368" marker-end="url(#arw)"/>

  <!-- Band B: application logic -->
  <rect x="472" y="368" width="584" height="222" rx="10" fill="#edf6f2" stroke="#c6ddd2"/>
  <text x="486" y="390" class="t-sec">APPLICATION LOGIC — HOOKS &amp; CONTEXT</text>
  <rect x="486" y="402" width="278" height="96" rx="8" fill="#ffffff" stroke="#d3ddea"/>
  <text x="500" y="426" class="t-h">useInvoices — useReducer store</text>
  <text x="500" y="448" class="t-b">invoices · loading · error · busy</text>
  <text x="500" y="468" class="t-b">lifted to AppShell → passed as props</text>
  <text x="500" y="488" class="t-b">add · update · delete · transmit · paid</text>
  <rect x="774" y="402" width="268" height="96" rx="8" fill="#ffffff" stroke="#d3ddea"/>
  <text x="788" y="426" class="t-h">AuthContext — demo session</text>
  <text x="788" y="448" class="t-b">password → SHA-256 digest compare</text>
  <text x="788" y="468" class="t-b">session in sessionStorage (tab-scoped)</text>
  <text x="788" y="488" class="t-b">read by Navbar · route guard · Login</text>
  <rect x="486" y="510" width="556" height="72" rx="8" fill="#ffffff" stroke="#d3ddea"/>
  <text x="500" y="534" class="t-h">Domain rules — pure functions (utils/)</text>
  <text x="500" y="556" class="t-b">GST 9% totals · INV-YYYY-NNN numbering · UEN &amp; Peppol ID (UEN@SGUEN)</text>
  <text x="500" y="574" class="t-b">overdue check · SGD formatting · status transitions</text>

  <path class="a" d="M 625 590 V 606" marker-end="url(#arw)"/>
  <path class="a" d="M 908 590 V 606" marker-end="url(#arw)"/>

  <!-- Band C: data access -->
  <rect x="472" y="606" width="584" height="218" rx="10" fill="#fdf5e9" stroke="#e6d2b8"/>
  <text x="486" y="628" class="t-sec">DATA ACCESS — CLIENT-SIDE</text>
  <rect x="486" y="640" width="180" height="104" rx="8" fill="#ffffff" stroke="#e0d6c2"/>
  <text x="500" y="664" class="t-h">Mock JSON API</text>
  <text x="500" y="688" class="t-bs">public/api/*.json, same origin</text>
  <text x="500" y="708" class="t-bs">invoices · customers · products</text>
  <text x="500" y="728" class="t-bs">fetched once, then cached</text>
  <rect x="676" y="640" width="180" height="104" rx="8" fill="#ffffff" stroke="#e0d6c2"/>
  <text x="690" y="664" class="t-h">Browser storage</text>
  <text x="690" y="688" class="t-bs">invoices cache — localStorage</text>
  <text x="690" y="708" class="t-bs">session — sessionStorage</text>
  <text x="690" y="728" class="t-bs">hints toggle · reset re-seeds</text>
  <rect x="866" y="640" width="180" height="104" rx="8" fill="#ffffff" stroke="#e0d6c2"/>
  <text x="880" y="664" class="t-h">Constants &amp; seed data</text>
  <text x="880" y="688" class="t-bs">GST 9% · statuses · UEN format</text>
  <text x="880" y="708" class="t-bs">API URLs · demo users (hashed)</text>
  <text x="880" y="728" class="t-bs">src/data/*.js</text>
  <text x="764" y="772" text-anchor="middle" class="t-bs">First load: fetch JSON → localStorage · every change persists · Reset re-seeds</text>
  <text x="764" y="792" text-anchor="middle" class="t-s">Session ends when the tab closes — a demo gate, not real security</text>

  <!-- ======================= RIGHT COLUMN: INTEGRATIONS ======================= -->
  <text x="1128" y="168" class="t-sec">INTEGRATIONS</text>

  <rect x="1128" y="182" width="424" height="170" rx="10" fill="#f7f9fc" stroke="#d5dfe8"/>
  <text x="1152" y="208" class="t-h">Legend</text>
  <rect x="1152" y="224" width="18" height="12" fill="#f5f7f9" stroke="#ccd4dc"/>
  <text x="1180" y="234" class="t-b">live behaviour (fetches, storage)</text>
  <rect x="1152" y="248" width="18" height="12" fill="#f6f3fc" stroke="#9b87c6" stroke-dasharray="4 3"/>
  <text x="1180" y="258" class="t-b">simulated in the browser</text>
  <text x="1152" y="282" class="t-s">invoice lifecycle:</text>
  <rect x="1152" y="290" width="50" height="22" rx="11" fill="#eef1f5" stroke="#b9c5d2"/>
  <text x="1177" y="305" text-anchor="middle" class="t-chip" fill="#4a5a6e">Draft</text>
  <text x="1212" y="305" class="t-s" fill="#8595a8">→</text>
  <rect x="1218" y="290" width="58" height="22" rx="11" fill="#fdf1de" stroke="#e2c190"/>
  <text x="1247" y="305" text-anchor="middle" class="t-chip" fill="#8a5a17">Queued</text>
  <text x="1284" y="305" class="t-s" fill="#8595a8">→</text>
  <rect x="1292" y="290" width="86" height="22" rx="11" fill="#e4ecfa" stroke="#b4c9ea"/>
  <text x="1335" y="305" text-anchor="middle" class="t-chip" fill="#2b5286">Transmitted</text>
  <text x="1386" y="305" class="t-s" fill="#8595a8">→</text>
  <rect x="1394" y="290" width="58" height="22" rx="11" fill="#fbe4e4" stroke="#e3b4b4"/>
  <text x="1423" y="305" text-anchor="middle" class="t-chip" fill="#a03636">Failed</text>
  <text x="1460" y="305" class="t-s" fill="#8595a8">→</text>
  <rect x="1468" y="290" width="46" height="22" rx="11" fill="#e2f2e6" stroke="#bedccc"/>
  <text x="1491" y="305" text-anchor="middle" class="t-chip" fill="#2f6b3f">Paid</text>
  <text x="1152" y="336" class="t-s">solid arrow = data flow · all actions are client-side</text>

  <!-- Simulated Peppol Access Point -->
  <rect x="1128" y="380" width="424" height="180" rx="10" fill="#f6f3fc" stroke="#9b87c6" stroke-dasharray="6 4"/>
  <text x="1152" y="406" class="t-h">Peppol Access Point — simulated</text>
  <text x="1152" y="430" class="t-b">in-browser transmission, ~1 s delay</text>
  <text x="1152" y="452" class="t-b">validates buyer UEN (SG entity formats)</text>
  <text x="1152" y="474" class="t-b">derives Peppol ID: UEN@SGUEN</text>
  <rect x="1152" y="490" width="50" height="22" rx="11" fill="#eef1f5" stroke="#b9c5d2"/>
  <text x="1177" y="505" text-anchor="middle" class="t-chip" fill="#4a5a6e">Draft</text>
  <text x="1212" y="505" class="t-s" fill="#8595a8">→</text>
  <rect x="1218" y="490" width="58" height="22" rx="11" fill="#fdf1de" stroke="#e2c190"/>
  <text x="1247" y="505" text-anchor="middle" class="t-chip" fill="#8a5a17">Queued</text>
  <text x="1284" y="505" class="t-s" fill="#8595a8">→</text>
  <rect x="1292" y="490" width="86" height="22" rx="11" fill="#e4ecfa" stroke="#b4c9ea"/>
  <text x="1335" y="505" text-anchor="middle" class="t-chip" fill="#2b5286">Transmitted</text>
  <text x="1386" y="505" class="t-s" fill="#8595a8">→</text>
  <rect x="1394" y="490" width="58" height="22" rx="11" fill="#fbe4e4" stroke="#e3b4b4"/>
  <text x="1423" y="505" text-anchor="middle" class="t-chip" fill="#a03636">Failed</text>
  <text x="1460" y="505" class="t-s" fill="#8595a8">→</text>
  <rect x="1468" y="490" width="46" height="22" rx="11" fill="#e2f2e6" stroke="#bedccc"/>
  <text x="1491" y="505" text-anchor="middle" class="t-chip" fill="#2f6b3f">Paid</text>
  <text x="1152" y="534" class="t-s">No real Peppol traffic — the “transmission” is a timed</text>
  <text x="1152" y="550" class="t-s">status change in local state (useInvoices).</text>

  <!-- Free public APIs -->
  <rect x="1128" y="600" width="424" height="118" rx="10" fill="#f5f7f9" stroke="#ccd4dc"/>
  <text x="1152" y="626" class="t-h">Free public APIs — live, keyless</text>
  <text x="1152" y="650" class="t-b">Frankfurter v1 — SGD FX rates (dashboard)</text>
  <text x="1152" y="672" class="t-b">randomuser.me — a contact per buyer</text>
  <text x="1152" y="696" class="t-s">fetched by useFetch with abort + retry</text>

  <!-- Also simulated -->
  <rect x="1128" y="758" width="424" height="90" rx="10" fill="#fafbfc" stroke="#b9c4cf" stroke-dasharray="6 4"/>
  <text x="1152" y="784" class="t-h">Also simulated (visible demo labels)</text>
  <text x="1152" y="808" class="t-b">IRAS submission · PayNow QR flag on invoice</text>
  <text x="1152" y="832" class="t-s">no external business transaction occurs</text>

  <!-- Integration arrows -->
  <path class="a" d="M 1080 460 H 1128" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="1104" y="446" text-anchor="middle" class="t-lbl">transmit · status</text>
  <path class="a" d="M 1080 660 H 1128" marker-end="url(#arw)"/>
  <text x="1104" y="646" text-anchor="middle" class="t-lbl">fetch</text>

  <!-- ======================= BOTTOM: BUILD & RELEASE ======================= -->
  <text x="48" y="882" class="t-sec">BUILD &amp; RELEASE — STATIC DEPLOYMENT</text>

  <rect x="48" y="890" width="268" height="84" rx="10" fill="#f7f9fc" stroke="#d5dfe8"/>
  <text x="62" y="916" class="t-h">GitHub repository</text>
  <text x="62" y="940" class="t-b">shared team source · 3 contributors</text>
  <text x="62" y="962" class="t-s">single repo: src · public · docs · scripts</text>

  <rect x="354" y="890" width="268" height="84" rx="10" fill="#f7f9fc" stroke="#d5dfe8"/>
  <text x="368" y="916" class="t-h">Vite build</text>
  <text x="368" y="940" class="t-b">BASE_PATH → /invoicenow/ · dist/</text>
  <text x="368" y="962" class="t-s">React + Tailwind, single SPA bundle</text>

  <rect x="660" y="890" width="268" height="84" rx="10" fill="#f7f9fc" stroke="#d5dfe8"/>
  <text x="674" y="916" class="t-h">postbuild.mjs</text>
  <text x="674" y="940" class="t-b">copies index.html per client route</text>
  <text x="674" y="962" class="t-s">deep links on a plain static host</text>

  <rect x="966" y="890" width="268" height="84" rx="10" fill="#f7f9fc" stroke="#d5dfe8"/>
  <text x="980" y="916" class="t-h">deploy.ps1 → static host</text>
  <text x="980" y="940" class="t-b">mirrors dist/ to site repo + NAS</text>
  <text x="980" y="962" class="t-s">nginx · Cloudflare · /invoicenow/</text>

  <rect x="1272" y="890" width="280" height="84" rx="10" fill="#eef4fb" stroke="#c9d8ea"/>
  <text x="1286" y="916" class="t-h">Live URL</text>
  <text x="1286" y="940" class="t-b">artificialintelligence.sg/invoicenow/</text>
  <text x="1286" y="962" class="t-s">behind the demo login gate</text>

  <path class="a" d="M 316 932 H 354" marker-end="url(#arw)"/>
  <path class="a" d="M 622 932 H 660" marker-end="url(#arw)"/>
  <path class="a" d="M 928 932 H 966" marker-end="url(#arw)"/>
  <path class="a" d="M 1234 932 H 1272" marker-end="url(#arw)"/>

  <!-- host serves the SPA -->
  <path class="a" d="M 1100 890 L 1012 840" marker-end="url(#arw)"/>
  <text x="1112" y="866" class="t-lbl">serves bundle + /api/*.json</text>
</svg>
