<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="880" viewBox="0 0 1360 880" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#475569"/>
    </marker>
    <marker id="ahf" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
    <marker id="ahv" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1360" height="880" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="44" font-size="20" font-weight="700" fill="#0f172a">EasyInvoice — Technical Architecture</text>
  <text x="40" y="68" font-size="11.5" fill="#64748b">React SPA simulating Singapore’s Peppol (InvoiceNow) e-invoicing — no own backend · NTU AI Engineering, Module 2</text>

  <!-- Legend -->
  <g font-size="10" fill="#475569">
    <line x1="1080" y1="30" x2="1112" y2="30" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="1122" y="34">data / REST</text>
    <line x1="1080" y1="50" x2="1112" y2="50" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahf)"/>
    <text x="1122" y="54">fallback / artifact</text>
    <line x1="1080" y1="70" x2="1112" y2="70" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ahv)"/>
    <text x="1122" y="74">build &amp; ops flow</text>
  </g>

  <!-- ================= Browser SPA ================= -->
  <g>
    <rect x="40" y="96" width="560" height="480" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M40,130 v-22 a12,12 0 0 1 12,-12 h516 a12,12 0 0 1 12,12 v22 Z" fill="#e2e8f0"/>
    <text x="56" y="118" font-size="13" font-weight="700" fill="#1e293b">Browser — EasyInvoice SPA<tspan font-weight="400" font-size="11.5" fill="#475569">  ·  React 19 · Vite 8 · React Router 7 · Tailwind 4</tspan></text>

    <!-- UI -->
    <rect x="60" y="140" width="520" height="84" rx="8" fill="#eaf2fd" stroke="#2563eb"/>
    <text x="74" y="158" font-size="12" font-weight="700" fill="#1e40af">UI — 7 pages · 13 components · client-side routes</text>
    <g font-size="10.5" fill="#334155" font-family="SFMono-Regular, Menlo, Consolas, monospace">
      <text x="74" y="178">Routes: /login · /tour (public) — / · /create · /edit?id= · /customers · /products (gated)</text>
      <text x="74" y="193">AppShell · Navbar · RequireAuth · Toast · ErrorBanner · SearchFilter · Hint</text>
      <text x="74" y="208">InvoiceList · InvoiceCard · InvoiceForm · PeppolStatusBadge · StatCards · FxRatesCard</text>
    </g>

    <!-- State -->
    <rect x="60" y="238" width="520" height="84" rx="8" fill="#e6f5f1" stroke="#0f766e"/>
    <text x="74" y="256" font-size="12" font-weight="700" fill="#115e59">State &amp; logic — hooks + context</text>
    <g font-size="10.5" fill="#334155">
      <text x="74" y="276">AuthContext — SHA-256 login gate; session { username, name, role, loginAt } in sessionStorage</text>
      <text x="74" y="291">useInvoices — useReducer store owned by AppShell; state changes only after the API confirms</text>
      <text x="74" y="306">useFetch — generic loader for live FX + contacts · roles.can(user, action, invoice)</text>
    </g>

    <!-- API layer -->
    <rect x="60" y="336" width="520" height="84" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="74" y="354" font-size="12" font-weight="700" fill="#1e293b">API layer — src/api/ (plain fetch, no libraries)</text>
    <g font-size="10.5" fill="#334155" font-family="SFMono-Regular, Menlo, Consolas, monospace">
      <text x="74" y="374">client.js — base = VITE_MOCKAPI_URL · throws readable Error on non-2xx · 204 → null</text>
      <text x="74" y="389">invoices.js — list / get / create / update / delete → /invoices</text>
      <text x="74" y="404">referenceData.js — GET /referenceData, filter by type: customer | product</text>
    </g>

    <!-- Domain -->
    <rect x="60" y="434" width="520" height="118" rx="8" fill="#fbf3e4" stroke="#b45309"/>
    <text x="74" y="452" font-size="12" font-weight="700" fill="#92400e">Domain rules — src/data/ + src/utils/ (client-side, no backend)</text>
    <g font-size="10.5" fill="#334155" font-family="SFMono-Regular, Menlo, Consolas, monospace">
      <text x="74" y="472">roles.js — can(user, action, invoice): EDIT vs VIEW_ONLY; guards routes + UI</text>
      <text x="74" y="487">constants.js — UEN regex · status enum · GST 9% · FX / contacts API URLs</text>
      <text x="74" y="502">invoice.js — line totals · INV-YYYY-NNN numbering · SGD format · overdue</text>
      <text x="74" y="517">users.js — 4 demo accounts (SHA-256 digests) · hash.js — WebCrypto sha256</text>
    </g>
    <text x="74" y="540" font-size="10.5" font-style="italic" fill="#92400e">The Peppol “Access Point” is simulated in-browser: 900 ms delay, then UEN validity check.</text>

    <!-- intra-layer flow -->
    <g stroke="#94a3b8" stroke-width="1.2">
      <line x1="320" y1="224" x2="320" y2="236" marker-end="url(#ahf)"/>
      <line x1="320" y1="322" x2="320" y2="334" marker-end="url(#ahf)"/>
      <line x1="320" y1="420" x2="320" y2="432" marker-end="url(#ahf)"/>
    </g>
  </g>

  <!-- ================= External services ================= -->
  <g>
    <rect x="680" y="96" width="280" height="480" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M680,130 v-22 a12,12 0 0 1 12,-12 h256 a12,12 0 0 1 12,12 v22 Z" fill="#e2e8f0"/>
    <text x="696" y="118" font-size="13" font-weight="700" fill="#1e293b">External services</text>

    <rect x="700" y="140" width="240" height="100" rx="8" fill="#fff7e6" stroke="#d97706"/>
    <text x="712" y="158" font-size="12" font-weight="700" fill="#92400e">mockapi.io — MockAPI (hosted)</text>
    <g font-size="10.5" fill="#334155">
      <text x="712" y="177">Shared JSON REST storage — one project,</text>
      <text x="712" y="192">visible to every browser · no auth</text>
      <text x="712" y="207" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10">resources: /invoices · /referenceData</text>
      <text x="712" y="222">Free tier: 2 resources · 429 rate limits</text>
    </g>

    <rect x="700" y="256" width="240" height="76" rx="8" fill="#f8fafc" stroke="#64748b" stroke-dasharray="5 4"/>
    <text x="712" y="274" font-size="12" font-weight="700" fill="#334155">public/api/*.json (same origin)</text>
    <g font-size="10.5" fill="#475569">
      <text x="712" y="293">Read-only offline demo data</text>
      <text x="712" y="308" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10">invoices · customers · products</text>
      <text x="712" y="323">When VITE_MOCKAPI_URL is unset; writes fail</text>
    </g>

    <rect x="700" y="348" width="240" height="64" rx="8" fill="#fff7e6" stroke="#d97706"/>
    <text x="712" y="366" font-size="12" font-weight="700" fill="#92400e">api.frankfurter.dev/v1</text>
    <g font-size="10.5" fill="#334155">
      <text x="712" y="385">Live SGD → USD, EUR, MYR, JPY, CNY</text>
      <text x="712" y="400">No key, CORS — feeds the dashboard FX card</text>
    </g>

    <rect x="700" y="428" width="240" height="64" rx="8" fill="#fff7e6" stroke="#d97706"/>
    <text x="712" y="446" font-size="12" font-weight="700" fill="#92400e">randomuser.me/api</text>
    <g font-size="10.5" fill="#334155">
      <text x="712" y="465">6 seeded contact persons (name, email, photo)</text>
      <text x="712" y="480">Paired with buyers on /customers</text>
    </g>

    <g font-size="10.5" font-style="italic" fill="#64748b">
      <text x="712" y="522">Only MockAPI is shared writable state;</text>
      <text x="712" y="537">FX and contacts are read-only reference;</text>
      <text x="712" y="552">no data is stored in the browser.</text>
    </g>
  </g>

  <!-- ================= Engineering & delivery ================= -->
  <g>
    <rect x="1000" y="96" width="320" height="480" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M1000,130 v-22 a12,12 0 0 1 12,-12 h296 a12,12 0 0 1 12,12 v22 Z" fill="#e2e8f0"/>
    <text x="1016" y="118" font-size="13" font-weight="700" fill="#1e293b">Engineering &amp; delivery</text>

    <rect x="1020" y="140" width="280" height="84" rx="8" fill="#f3f0ff" stroke="#6d28d9"/>
    <text x="1032" y="158" font-size="12" font-weight="700" fill="#5b21b6">CI — GitHub Actions (main + PRs)</text>
    <g font-size="10.5" fill="#334155">
      <text x="1032" y="178">Node 22 · npm ci</text>
      <text x="1032" y="193">npm test — Vitest 5 + Testing Library (jsdom)</text>
      <text x="1032" y="208">npm run build — Vite + Tailwind 4</text>
    </g>

    <rect x="1020" y="240" width="280" height="96" rx="8" fill="#f3f0ff" stroke="#6d28d9"/>
    <text x="1032" y="258" font-size="12" font-weight="700" fill="#5b21b6">Deploy — static, no server runtime</text>
    <g font-size="10.5" fill="#334155">
      <text x="1032" y="277">Vercel — tracks main, auto-deploys on merge</text>
      <text x="1032" y="292">vercel.json — SPA rewrite: any route → index.html</text>
      <text x="1032" y="307" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10">aie1f-easyinvoice.vercel.app (live)</text>
      <text x="1032" y="322">VITE_MOCKAPI_URL set as a Vercel env var</text>
    </g>

    <rect x="1020" y="352" width="280" height="96" rx="8" fill="#f3f0ff" stroke="#6d28d9"/>
    <text x="1032" y="370" font-size="12" font-weight="700" fill="#5b21b6">One-off Node scripts</text>
    <g font-size="10.5" fill="#334155">
      <text x="1032" y="389">seed-mockapi.mjs — purge + reseed MockAPI from</text>
      <text x="1032" y="404">static JSON (350 ms throttle, retry on 429)</text>
      <text x="1032" y="419">postbuild.mjs — index.html per route (static hosts)</text>
      <text x="1032" y="434">deploy.ps1 — legacy NAS prototype (reference only)</text>
    </g>

    <rect x="1020" y="464" width="280" height="88" rx="8" fill="#f3f0ff" stroke="#6d28d9"/>
    <text x="1032" y="482" font-size="12" font-weight="700" fill="#5b21b6">Governance &amp; docs</text>
    <g font-size="10.5" fill="#334155">
      <text x="1032" y="501">CODEOWNERS · PR template · CONTRIBUTING</text>
      <text x="1032" y="516">docs/ — PRD · architecture · decisions log · tests</text>
      <text x="1032" y="531">docs/design/ — this architecture diagram</text>
    </g>

    <!-- CI -> Deploy -->
    <line x1="1160" y1="224" x2="1160" y2="236" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ahv)"/>
    <text x="1152" y="233" font-size="9.5" fill="#7c3aed" text-anchor="end">build → deploy</text>
  </g>

  <!-- ================= Cross-zone connections ================= -->
  <!-- SPA -> MockAPI (trunk + branches) -->
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <path d="M600,345 H630 V190 H697" marker-end="url(#ah)"/>
    <path d="M600,380 H697" marker-end="url(#ah)"/>
    <path d="M600,412 H630 V460 H697" marker-end="url(#ah)"/>
  </g>
  <path d="M630,294 H697" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ahf)"/>
  <g font-size="10" fill="#475569" text-anchor="middle">
    <text x="664" y="183">REST</text>
    <text x="664" y="287">fallback</text>
    <text x="649" y="373">FX</text>
    <text x="664" y="453">contacts</text>
  </g>

  <!-- seed: scripts -> MockAPI (over the top) -->
  <path d="M1160,352 V88 H820 V137" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#ahv)"/>
  <text x="980" y="84" font-size="10" fill="#7c3aed" text-anchor="middle">npm run seed — one-off, throttled</text>

  <!-- Vercel -> browser: static SPA -->
  <path d="M1020,288 H980 V600 H320 V579" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ahf)"/>
  <text x="650" y="594" font-size="10" fill="#64748b" text-anchor="middle">serves static SPA (dist/)</text>

  <!-- ================= Invoice lifecycle ================= -->
  <g>
    <rect x="40" y="632" width="1280" height="196" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="60" y="656" font-size="13" font-weight="700" fill="#0f172a">Invoice lifecycle — simulated state machine (useInvoices: 900 ms delay, then UEN validity check)</text>

    <rect x="80" y="676" width="110" height="34" rx="17" fill="#eaf2fd" stroke="#2563eb"/>
    <text x="135" y="698" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">Draft</text>
    <rect x="300" y="676" width="110" height="34" rx="17" fill="#f1f5f9" stroke="#64748b"/>
    <text x="355" y="698" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Queued</text>
    <rect x="560" y="676" width="130" height="34" rx="17" fill="#e6f5f1" stroke="#0f766e"/>
    <text x="625" y="698" font-size="11.5" font-weight="700" fill="#115e59" text-anchor="middle">Transmitted</text>
    <rect x="820" y="676" width="110" height="34" rx="17" fill="#e8f6ee" stroke="#16a34a"/>
    <text x="875" y="698" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">Paid</text>
    <rect x="465" y="740" width="110" height="34" rx="17" fill="#fdecec" stroke="#dc2626"/>
    <text x="520" y="762" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Failed</text>

    <g stroke="#475569" stroke-width="1.5" fill="none">
      <path d="M190,693 H298" marker-end="url(#ah)"/>
      <path d="M410,693 H558" marker-end="url(#ah)"/>
      <path d="M690,693 H818" marker-end="url(#ah)"/>
      <path d="M330,710 V758 H463" marker-end="url(#ah)"/>
      <path d="M520,740 V722 H380 V712" marker-end="url(#ah)"/>
    </g>
    <g font-size="9.5" fill="#475569" text-anchor="middle">
      <text x="244" y="686">transmit</text>
      <text x="484" y="686">900 ms</text>
      <text x="754" y="686">mark paid</text>
      <text x="396" y="752">invalid UEN</text>
      <text x="450" y="716">retry</text>
    </g>
    <text x="135" y="728" font-size="9.5" fill="#64748b" text-anchor="middle">created as Draft</text>

    <g font-size="10.5" fill="#475569">
      <text x="990" y="678" font-size="11.5" font-weight="700" fill="#1e293b">Permissions — roles.can(user, action, invoice)</text>
      <text x="990" y="698">· create — EDIT only (route + UI guarded)</text>
      <text x="990" y="714">· edit / transmit — Draft or Failed only</text>
      <text x="990" y="730">· mark paid — Transmitted only</text>
      <text x="990" y="746">· delete — never Paid; Paid is read-only</text>
      <text x="990" y="762">· VIEW_ONLY — everything read-only</text>
      <text x="990" y="784" font-size="10" font-style="italic" fill="#94a3b8">maker-checker deferred — pendingRequest field reserved</text>
    </g>
  </g>

  <text x="1320" y="860" font-size="10" fill="#94a3b8" text-anchor="end">Generated 2026-09-28 08:15 SGT · Qwen3.8-27B-MLX-4bit · source: m2-b2b-invoice-mgmt-sys (main)</text>
</svg>
