<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1260" viewBox="0 0 1500 1260" role="img" aria-labelledby="title desc">
<title id="title">Coffee House Invoice Manager — Seven-Day Scope Architecture</title>
<desc id="desc">Solid boxes show the seven-day MVP: GitHub deploys to Vercel; a browser React app uses routes, reusable components, state hooks and Context, and fetch to create, read and delete draft invoices in MockAPI. Customers come from fixed bundled JSON. A separate dashed future-phase box includes Update, customer management, printing and production capabilities.</desc>
<defs>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.6"/></marker>
 <style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#18283c} .title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#596b80}.label{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#596b80}.head{font-size:23px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#526479}.mono{font-family:Menlo,Consolas,monospace;font-size:16px}.box{fill:white;stroke:#d7e0ea;stroke-width:1.5}.flow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.rule{stroke:#e0e7ef;stroke-width:1}
 </style>
</defs>
<rect width="1500" height="1260" fill="#f5f7fb"/>
<text x="60" y="61" class="title">Coffee House Invoice Manager</text>
<text x="60" y="93" class="sub">Seven-day MVP • Solid boxes = in scope • Dashed box = future phases</text>

<!-- Use cases -->
<rect x="60" y="124" width="1380" height="134" rx="16" class="box"/>
<text x="84" y="153" class="label">USERS &amp; USE CASES</text>
<text x="84" y="187" class="head">Café owner / staff</text>
<text x="84" y="217" class="small">Fictional classroom data</text>
<line x1="344" y1="151" x2="344" y2="232" class="rule"/>
<text x="374" y="184" class="body">Select a demo customer</text>
<text x="374" y="216" class="body">Create itemised invoices</text>
<text x="714" y="184" class="body">List / open invoices</text>
<text x="714" y="216" class="body">Delete incorrect drafts</text>
<text x="1050" y="184" class="body">Share saved invoices</text>
<text x="1050" y="216" class="small">Another browser refreshes to view</text>
<path d="M750 258V302" class="flow"/>

<!-- Left delivery column -->
<text x="60" y="302" class="label">CODE &amp; DEPLOYMENT</text>
<rect x="60" y="320" width="290" height="164" rx="16" class="box"/>
<text x="84" y="359" class="head">GitHub</text>
<text x="84" y="392" class="body">Source code + assets</text>
<text x="84" y="423" class="small">Feature branches → PR reviews</text>
<text x="84" y="449" class="small">Issues + member commits</text>
<path d="M205 484V554" class="flow"/>
<text x="223" y="526" class="small">Push / merge</text>
<rect x="60" y="566" width="290" height="179" rx="16" class="box"/>
<text x="84" y="606" class="head">Vercel</text>
<text x="84" y="640" class="body">Build Vite → host dist/</text>
<text x="84" y="671" class="small">Public URL + PR previews</text>
<text x="84" y="698" class="small">SPA rewrite supports refresh</text>
<text x="84" y="724" class="small">on /invoices/:id and other routes</text>
<path d="M350 638H430" class="flow"/>
<text x="365" y="612" class="small">Serves</text>
<text x="60" y="795" class="small">GitHub stores code.</text>
<text x="60" y="820" class="small">Vercel hosts the frontend.</text>
<text x="60" y="845" class="small">Neither stores live invoice records</text>
<text x="60" y="870" class="small">in this proposed setup.</text>

<!-- Browser application -->
<rect x="440" y="310" width="610" height="640" rx="18" fill="#edf4ff" stroke="#a9c4e7" stroke-width="1.5"/>
<text x="465" y="344" class="label">EACH USER'S BROWSER</text>
<text x="465" y="379" class="head">React app • built with Vite</text>
<rect x="463" y="400" width="564" height="154" rx="12" class="box"/>
<text x="483" y="430" class="body" font-weight="700">Routes — React Router</text>
<text x="483" y="460" class="mono">/</text><text x="734" y="460" class="small">Redirect to invoice list</text>
<text x="483" y="487" class="mono">/invoices/new</text><text x="734" y="487" class="small">New invoice form</text>
<text x="483" y="514" class="mono">/invoices</text><text x="734" y="514" class="small">Invoice collection</text>
<text x="483" y="541" class="mono">/invoices/:id</text><text x="734" y="541" class="small">Invoice details</text>
<path d="M745 554V578" class="flow"/>
<rect x="463" y="589" width="564" height="108" rx="12" class="box"/>
<text x="483" y="618" class="body" font-weight="700">Composition — pages reuse components</text>
<text x="483" y="648" class="small">Layout • InvoiceForm • LineItemEditor • InvoiceRow</text>
<text x="483" y="674" class="small">InvoiceList • InvoiceDetails • Totals • ErrorMessage</text>
<path d="M745 697V721" class="flow" marker-start="url(#arrow)"/>
<rect x="463" y="732" width="564" height="115" rx="12" class="box"/>
<text x="483" y="761" class="body" font-weight="700">State — useState / useEffect + Context</text>
<text x="483" y="791" class="small">Shared provider: invoices, list loading / errors</text>
<text x="483" y="817" class="small">Local: form, detail, save / delete states; derived totals</text>
<path d="M745 847V870" class="flow" marker-start="url(#arrow)"/>
<rect x="463" y="881" width="564" height="48" rx="10" fill="#dce9fa"/>
<text x="483" y="911" class="body" font-weight="700">API service: fetch() • check response • update state</text>

<!-- Shared backend -->
<text x="1140" y="302" class="label">SHARED ONLINE STORAGE</text>
<rect x="1140" y="320" width="300" height="254" rx="16" fill="#eef8f3" stroke="#accfbd" stroke-width="1.5"/>
<text x="1164" y="360" class="head">MockAPI.io</text>
<text x="1164" y="392" class="small">Hosted REST API + persistence</text>
<line x1="1164" y1="411" x2="1416" y2="411" class="rule"/>
<text x="1164" y="443" class="mono">/invoices only</text>
<text x="1164" y="470" class="small">One shared resource</text>
<text x="1164" y="509" class="body">Saved draft invoices</text>
<text x="1164" y="536" class="small">Customer snapshot, items, total,</text>
<text x="1164" y="558" class="small">date, status, API-generated ID</text>
<rect x="1140" y="600" width="300" height="190" rx="16" class="box"/>
<text x="1164" y="634" class="label">MVP: CREATE / READ / DELETE</text>
<text x="1164" y="673" class="body">C   POST — create</text>
<text x="1164" y="709" class="body">R   GET — list / details</text>

<text x="1164" y="745" class="body">D   DELETE — remove draft</text>
<text x="1140" y="845" class="small">Fixed customers: bundled JSON.</text>
<text x="1140" y="873" class="small">No team-managed database/server.</text>
<text x="1140" y="901" class="small">MockAPI manages stored records.</text>
<!-- Dedicated connector lane -->
<path d="M1027 905H1095V450H1140" class="flow" marker-start="url(#arrow)"/>

<!-- Bottom takeaway -->
<rect x="60" y="979" width="1380" height="65" rx="14" fill="#e7edf5"/>
<text x="84" y="1006" class="body" font-weight="700">Shared persistence ≠ live synchronisation</text>
<text x="84" y="1030" class="small">One shared API URL for all browsers. Save → API confirms → refresh / re-fetch elsewhere to see changes. React state itself stays in each browser.</text>
<rect x="60" y="1070" width="1380" height="150" rx="16" fill="#fffaf0" stroke="#b58a42" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="84" y="1100" class="label">FUTURE PHASES — NOT IN THE SEVEN-DAY BUILD</text>
<text x="84" y="1134" class="body" font-weight="700">Phase 2: extend the workflow</text>
<text x="84" y="1163" class="small">U = PUT / PATCH • Edit drafts • Sent / Paid status • Customer CRUD</text>
<text x="84" y="1191" class="small">Search • Print / PDF • Discounts / tax • Business settings / summaries</text>
<line x1="760" y1="1120" x2="760" y2="1200" class="rule"/>
<text x="790" y="1134" class="body" font-weight="700">Phase 3: prepare for real use</text>
<text x="790" y="1163" class="small">Authentication / roles • Protected backend • Audit / backups</text>
<text x="790" y="1191" class="small">Email / payments • Concurrent-edit protection • Live updates</text>
</svg>
