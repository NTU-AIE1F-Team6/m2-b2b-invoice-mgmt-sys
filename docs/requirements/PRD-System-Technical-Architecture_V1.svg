<text x="92" y="365" class="body">Login   /   Dashboard &amp; filters   /   New Invoice   /   Invoice Detail &amp; Approval</text>
<text x="92" y="388" class="body">ProtectedRoute · shared layout · invoice list · line-item editor · loading / error / empty states</text>
