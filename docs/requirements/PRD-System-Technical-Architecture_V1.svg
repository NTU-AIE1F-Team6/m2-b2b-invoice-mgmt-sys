<text x="590" y="499" class="body">Context + useReducer → invoices, loading, errors</text>
<text x="590" y="522" class="body">useEffect → fetch on screen entry / refresh</text>
<text x="590" y="545" class="body">AuthContext → demo user + View-only / Edit role</text>
<path d="M 307 573 V 612" fill="none" stroke="#60758a" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 807 573 V 612" fill="none" stroke="#60758a" stroke-width="1.7" marker-end="url(#arrow)"/>
