<text x="92" y="471" class="heading">Forms &amp; local state</text>
<text x="92" y="499" class="body">useState → controlled inputs, search, filters</text>
<text x="92" y="522" class="body">Yup → field-on-blur + form-on-submit validation</text>
<text x="92" y="545" class="body">Events update inputs; derived totals update the UI</text>
