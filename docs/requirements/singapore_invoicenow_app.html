<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvoiceNow SG - Peppol E-Invoicing Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React 18 UMD Scripts -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel Standalone for JSX compilation -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_INVOICES = [
            {
                id: "INV-2026-001",
                buyerName: "Temasek Tech Solutions Pte Ltd",
                buyerUEN: "202012345E",
                peppolId: "202012345E@SGUEN",
                issueDate: "2026-09-01",
                dueDate: "2026-10-01",
                items: [
                    { description: "Cloud Infrastructure Setup", qty: 1, unitPrice: 3500.00 }
                ],
                subtotal: 3500.00,
                gst: 315.00,
                total: 3815.00,
                status: "Transmitted (Peppol)",
                includePayNowQR: true,
                createdAt: new Date().toISOString()
            },
            {
                id: "INV-2026-002",
                buyerName: "Marina Bay Logistics Pte Ltd",
                buyerUEN: "199854321W",
                peppolId: "199854321W@SGUEN",
                issueDate: "2026-09-10",
                dueDate: "2026-10-10",
                items: [
                    { description: "Enterprise Fleet GPS Tracking Unit", qty: 10, unitPrice: 250.00 },
                    { description: "Annual Software Maintenance", qty: 1, unitPrice: 1200.00 }
                ],
                subtotal: 3700.00,
                gst: 333.00,
                total: 4033.00,
                status: "Paid",
                includePayNowQR: true,
                createdAt: new Date().toISOString()
            },
            {
                id: "INV-2026-003",
                buyerName: "Singapura Retail Group",
                buyerUEN: "201598764Z",
                peppolId: "201598764Z@SGUEN",
                issueDate: "2026-09-18",
                dueDate: "2026-10-18",
                items: [
                    { description: "POS Terminal Hardware Integration", qty: 3, unitPrice: 850.00 }
                ],
                subtotal: 2550.00,
                gst: 229.50,
                total: 2779.50,
                status: "Draft",
                includePayNowQR: false,
                createdAt: new Date().toISOString()
            }
        ];

        function Navbar({ currentRoute, navigate }) {
            return (
                <nav className="bg-slate-900 border-b border-slate-800 text-white shadow-md sticky top-0 z-50">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between h-16 items-center">
                            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => navigate('dashboard')}>
                                <div className="bg-blue-600 p-2 rounded-xl flex items-center justify-center text-white font-bold shadow">
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                    </svg>
                                </div>
                                <div>
                                    <span className="text-lg font-bold tracking-tight bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">InvoiceNow SG</span>
                                    <span className="block text-xs text-slate-400">Singapore National Peppol E-Invoicing Network</span>
                                </div>
                            </div>
                            <div className="flex items-center space-x-4">
                                <button 
                                    onClick={() => navigate('dashboard')}
                                    className={`text-sm font-medium px-3 py-2 rounded-lg transition ${currentRoute === 'dashboard' ? 'bg-slate-800 text-white' : 'text-slate-300 hover:text-white hover:bg-slate-800'}`}
                                >
                                    Dashboard
                                </button>
                                <button 
                                    onClick={() => navigate('create')}
                                    className="inline-flex items-center space-x-1 text-sm font-medium bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg shadow-sm transition"
                                >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
                                    <span>New E-Invoice</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </nav>
            );
        }

        function ToastContainer({ toast }) {
            if (!toast) return null;
            const bgColors = {
                success: 'bg-emerald-600 text-white',
                info: 'bg-sky-600 text-white',
                error: 'bg-rose-600 text-white'
            };
            return (
                <div className="fixed bottom-5 right-5 z-50 animate-bounce">
                    <div className={`px-4 py-3 rounded-xl shadow-xl flex items-center space-x-2 text-sm font-medium ${bgColors[toast.type] || bgColors.success}`}>
                        <span>{toast.message}</span>
                    </div>
                </div>
            );
        }

        function DashboardPage({ invoices, onDelete, onTransmit, onEdit, navigate, loading }) {
            const [searchTerm, setSearchTerm] = useState("");
            const [statusFilter, setStatusFilter] = useState("All");

            const filteredInvoices = invoices.filter(inv => {
                const matchesSearch = inv.buyerName.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                      inv.buyerUEN.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                      inv.id.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesStatus = statusFilter === "All" || inv.status === statusFilter;
                return matchesSearch && matchesStatus;
            });

            const totalRevenue = invoices.filter(i => i.status === 'Paid').reduce((sum, i) => sum + i.total, 0);
            const pendingPeppol = invoices.filter(i => i.status === 'Transmitted (Peppol)').reduce((sum, i) => sum + i.total, 0);
            const totalDrafts = invoices.filter(i => i.status === 'Draft').length;

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
                    <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <div className="flex items-center space-x-2">
                                <span className="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                                <h1 className="text-xl font-bold text-slate-900">Peppol Access Point Connected</h1>
                            </div>
                            <p className="text-sm text-slate-500 mt-1">Easily send and receive machine-readable XML e-invoices across Singapore registered UENs.</p>
                        </div>
                        <button onClick={() => navigate('create')} className="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-xl shadow-md transition text-sm">
                            + Create New Invoice
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                            <div>
                                <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Collected Revenue (SGD)</p>
                                <h3 className="text-2xl font-bold text-slate-900 mt-1">${totalRevenue.toLocaleString('en-SG', {minimumFractionDigits: 2})}</h3>
                            </div>
                            <div className="bg-emerald-50 text-emerald-600 p-3 rounded-xl">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                            <div>
                                <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">In Transit (Peppol Network)</p>
                                <h3 className="text-2xl font-bold text-blue-600 mt-1">${pendingPeppol.toLocaleString('en-SG', {minimumFractionDigits: 2})}</h3>
                            </div>
                            <div className="bg-blue-50 text-blue-600 p-3 rounded-xl">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                            <div>
                                <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Unsent Drafts</p>
                                <h3 className="text-2xl font-bold text-amber-600 mt-1">{totalDrafts} Invoices</h3>
                            </div>
                            <div className="bg-amber-50 text-amber-600 p-3 rounded-xl">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col sm:flex-row justify-between gap-4">
                        <div className="relative flex-1">
                            <svg className="w-5 h-5 absolute left-3.5 top-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            <input 
                                type="text"
                                placeholder="Search by Buyer Name, UEN, or Invoice ID..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="w-full pl-11 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                        </div>
                        <div className="flex items-center space-x-2 overflow-x-auto pb-1 sm:pb-0">
                            {["All", "Transmitted (Peppol)", "Paid", "Draft"].map((status) => (
                                <button
                                    key={status}
                                    onClick={() => setStatusFilter(status)}
                                    className={`px-3 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ${statusFilter === status ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                >
                                    {status}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                        {loading && (
                            <div className="p-8 text-center text-slate-500 flex items-center justify-center space-x-2">
                                <div className="w-5 h-5 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                                <span className="text-sm font-medium">Processing Peppol transmission...</span>
                            </div>
                        )}
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-50 border-b border-slate-100 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                        <th className="p-4">Invoice ID</th>
                                        <th className="p-4">Buyer Entity & UEN</th>
                                        <th className="p-4">Peppol ID</th>
                                        <th className="p-4">Issue Date</th>
                                        <th className="p-4">Total Amount</th>
                                        <th className="p-4">Status</th>
                                        <th className="p-4 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 text-sm">
                                    {filteredInvoices.length === 0 ? (
                                        <tr>
                                            <td colSpan="7" className="text-center py-12 text-slate-400">
                                                No invoices found matching your criteria.
                                            </td>
                                        </tr>
                                    ) : (
                                        filteredInvoices.map((inv) => {
                                            const statusStyles = {
                                                "Transmitted (Peppol)": "bg-blue-50 text-blue-700 border-blue-200",
                                                "Paid": "bg-emerald-50 text-emerald-700 border-emerald-200",
                                                "Draft": "bg-amber-50 text-amber-700 border-amber-200"
                                            };
                                            return (
                                                <tr key={inv.id} className="hover:bg-slate-50/70 transition">
                                                    <td className="p-4 font-semibold text-slate-900">{inv.id}</td>
                                                    <td className="p-4">
                                                        <div className="font-medium text-slate-800">{inv.buyerName}</div>
                                                        <div className="text-xs text-slate-400">UEN: {inv.buyerUEN}</div>
                                                    </td>
                                                    <td className="p-4 font-mono text-xs text-slate-600">{inv.peppolId}</td>
                                                    <td className="p-4 text-slate-600">{inv.issueDate}</td>
                                                    <td className="p-4 font-semibold text-slate-900">${inv.total.toLocaleString('en-SG', {minimumFractionDigits: 2})}</td>
                                                    <td className="p-4">
                                                        <span className={`inline-flex px-2.5 py-1 rounded-full text-xs font-semibold border ${statusStyles[inv.status]}`}>
                                                            {inv.status}
                                                        </span>
                                                    </td>
                                                    <td className="p-4 text-right space-x-2 whitespace-nowrap">
                                                        {inv.status === 'Draft' && (
                                                            <button 
                                                                onClick={() => onTransmit(inv.id)}
                                                                className="text-xs bg-blue-50 hover:bg-blue-100 text-blue-600 font-semibold px-2.5 py-1.5 rounded-lg transition"
                                                            >
                                                                Transmit
                                                            </button>
                                                        )}
                                                        <button 
                                                            onClick={() => onEdit(inv.id)}
                                                            className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-2.5 py-1.5 rounded-lg transition"
                                                        >
                                                            Edit
                                                        </button>
                                                        <button 
                                                            onClick={() => onDelete(inv.id)}
                                                            className="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold px-2.5 py-1.5 rounded-lg transition"
                                                        >
                                                            Delete
                                                        </button>
                                                    </td>
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function InvoiceFormPage({ onSave, editData, navigate }) {
            const isEditing = Boolean(editData);
            const [buyerName, setBuyerName] = useState(editData ? editData.buyerName : "");
            const [buyerUEN, setBuyerUEN] = useState(editData ? editData.buyerUEN : "");
            const [issueDate, setIssueDate] = useState(editData ? editData.issueDate : new Date().toISOString().split('T')[0]);
            const [dueDate, setDueDate] = useState(editData ? editData.dueDate : new Date(Date.now() + 30*86400000).toISOString().split('T')[0]);
            const [includePayNowQR, setIncludePayNowQR] = useState(editData ? editData.includePayNowQR : true);
            const [status, setStatus] = useState(editData ? editData.status : "Transmitted (Peppol)");
            const [items, setItems] = useState(editData ? editData.items : [
                { description: "Professional Consulting Services", qty: 1, unitPrice: 1500.00 }
            ]);
            const [validationError, setValidationError] = useState("");

            const subtotal = items.reduce((sum, item) => sum + (Number(item.qty) || 0) * (Number(item.unitPrice) || 0), 0);
            const gst = subtotal * 0.09;
            const total = subtotal + gst;

            const handleItemChange = (index, field, value) => {
                const newItems = [...items];
                newItems[index][field] = value;
                setItems(newItems);
            };

            const addItemRow = () => {
                setItems([...items, { description: "", qty: 1, unitPrice: 0 }]);
            };

            const removeItemRow = (index) => {
                if (items.length > 1) {
                    setItems(items.filter((_, i) => i !== index));
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!buyerName.trim()) {
                    setValidationError("Please enter the buyer company name.");
                    return;
                }
                if (!buyerUEN.trim()) {
                    setValidationError("Please enter a valid Singapore UEN.");
                    return;
                }
                
                const peppolId = `${buyerUEN.trim()}@SGUEN`;
                const invoicePayload = {
                    ...(editData ? { id: editData.id } : {}),
                    buyerName,
                    buyerUEN: buyerUEN.trim(),
                    peppolId,
                    issueDate,
                    dueDate,
                    items: items.map(i => ({ ...i, qty: Number(i.qty), unitPrice: Number(i.unitPrice) })),
                    subtotal,
                    gst,
                    total,
                    status,
                    includePayNowQR
                };

                onSave(invoicePayload, isEditing);
                navigate('dashboard');
            };

            return (
                <div className="max-w-4xl mx-auto px-4 py-8">
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 md:p-8 space-y-6">
                        <div className="flex justify-between items-center border-b border-slate-100 pb-4">
                            <div>
                                <h1 className="text-xl font-bold text-slate-900">{isEditing ? `Edit Invoice (${editData.id})` : "Create New Peppol E-Invoice"}</h1>
                                <p className="text-sm text-slate-500">Compliant with Singapore InvoiceNow standards and IRAS tax regulations.</p>
                            </div>
                            <button onClick={() => navigate('dashboard')} className="text-sm text-slate-500 hover:text-slate-800 font-medium">Cancel</button>
                        </div>

                        {validationError && (
                            <div className="bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl text-sm">
                                {validationError}
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Buyer Company Name</label>
                                    <input 
                                        type="text"
                                        required
                                        placeholder="e.g. Temasek Tech Pte Ltd"
                                        value={buyerName}
                                        onChange={(e) => setBuyerName(e.target.value)}
                                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Buyer Singapore UEN</label>
                                    <input 
                                        type="text"
                                        required
                                        placeholder="e.g. 202012345E"
                                        value={buyerUEN}
                                        onChange={(e) => setBuyerUEN(e.target.value)}
                                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm uppercase focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                    />
                                    <span className="text-xs text-slate-400 mt-1 block">Peppol ID will auto-format as: {buyerUEN ? `${buyerUEN}@SGUEN` : '...'}</span>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Issue Date</label>
                                    <input 
                                        type="date"
                                        value={issueDate}
                                        onChange={(e) => setIssueDate(e.target.value)}
                                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Payment Due Date</label>
                                    <input 
                                        type="date"
                                        value={dueDate}
                                        onChange={(e) => setDueDate(e.target.value)}
                                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Network Status</label>
                                    <select 
                                        value={status}
                                        onChange={(e) => setStatus(e.target.value)}
                                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                    >
                                        <option value="Transmitted (Peppol)">Transmitted (Peppol)</option>
                                        <option value="Draft">Draft</option>
                                        <option value="Paid">Paid</option>
                                    </select>
                                </div>
                            </div>

                            <div className="space-y-3 pt-2">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wider">Invoice Line Items</h3>
                                    <button 
                                        type="button"
                                        onClick={addItemRow}
                                        className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-lg transition"
                                    >
                                        + Add Item
                                    </button>
                                </div>
                                {items.map((item, index) => (
                                    <div key={index} className="flex gap-3 items-center bg-slate-50/50 p-3 rounded-xl border border-slate-100">
                                        <input 
                                            type="text"
                                            placeholder="Item description or service name"
                                            value={item.description}
                                            onChange={(e) => handleItemChange(index, 'description', e.target.value)}
                                            className="flex-1 px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none"
                                            required
                                        />
                                        <input 
                                            type="number"
                                            min="1"
                                            placeholder="Qty"
                                            value={item.qty}
                                            onChange={(e) => handleItemChange(index, 'qty', e.target.value)}
                                            className="w-20 px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none"
                                            required
                                        />
                                        <input 
                                            type="number"
                                            step="0.01"
                                            placeholder="Unit Price ($)"
                                            value={item.unitPrice}
                                            onChange={(e) => handleItemChange(index, 'unitPrice', e.target.value)}
                                            className="w-32 px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none"
                                            required
                                        />
                                        {items.length > 1 && (
                                            <button 
                                                type="button" 
                                                onClick={() => removeItemRow(index)}
                                                className="text-rose-500 hover:text-rose-700 p-2 font-bold"
                                            >
                                                &times;
                                            </button>
                                        )}
                                    </div>
                                ))}
                            </div>

                            <div className="bg-slate-50 p-5 rounded-xl border border-slate-200/60 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                <div className="space-y-2">
                                    <label className="flex items-center space-x-2 cursor-pointer">
                                        <input 
                                            type="checkbox"
                                            checked={includePayNowQR}
                                            onChange={(e) => setIncludePayNowQR(e.target.checked)}
                                            className="rounded border-slate-300 text-blue-600 focus:ring-blue-500 w-4 h-4"
                                        />
                                        <span className="text-sm font-medium text-slate-700">Embed Dynamic PayNow UEN QR Code for Instant B2B Settlement</span>
                                    </label>
                                </div>
                                <div className="text-right space-y-1 w-full sm:w-auto">
                                    <div className="text-xs text-slate-500">Subtotal: ${subtotal.toFixed(2)}</div>
                                    <div className="text-xs text-slate-500">Singapore GST (9%): ${gst.toFixed(2)}</div>
                                    <div className="text-base font-bold text-slate-900">Total Due: ${total.toFixed(2)} SGD</div>
                                </div>
                            </div>

                            <div className="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                                <button type="button" onClick={() => navigate('dashboard')} className="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition">Cancel</button>
                                <button type="submit" className="px-6 py-2.5 rounded-xl text-sm font-medium bg-blue-600 hover:bg-blue-700 text-white shadow-md transition">
                                    {isEditing ? "Save Changes" : "Transmit via Peppol Network"}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function App() {
            const [invoices, setInvoices] = useState(() => {
                try {
                    const saved = localStorage.getItem('singapore_peppol_invoices_v2');
                    return saved ? JSON.parse(saved) : INITIAL_INVOICES;
                } catch (e) {
                    return INITIAL_INVOICES;
                }
            });
            const [currentRoute, setCurrentRoute] = useState('dashboard');
            const [editId, setEditId] = useState(null);
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);

            useEffect(() => {
                try {
                    localStorage.setItem('singapore_peppol_invoices_v2', JSON.stringify(invoices));
                } catch (e) {}
            }, [invoices]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const navigate = (route) => {
                setCurrentRoute(route);
                if (route !== 'edit') setEditId(null);
                window.scrollTo(0, 0);
            };

            const handleSaveInvoice = (invoiceData, isEditing) => {
                setLoading(true);
                setTimeout(() => {
                    if (isEditing) {
                        setInvoices(invoices.map(inv => inv.id === invoiceData.id ? invoiceData : inv));
                        showToast(`Invoice ${invoiceData.id} updated successfully.`);
                    } else {
                        const newId = `INV-2026-${String(invoices.length + 1).padStart(3, '0')}`;
                        const newInvoice = { ...invoiceData, id: newId, createdAt: new Date().toISOString() };
                        setInvoices([newInvoice, ...invoices]);
                        showToast(`Invoice ${newId} successfully transmitted via Peppol!`);
                    }
                    setLoading(false);
                }, 600);
            };

            const handleDelete = (id) => {
                if (window.confirm(`Are you sure you want to delete invoice ${id}?`)) {
                    setInvoices(invoices.filter(inv => inv.id !== id));
                    showToast(`Invoice ${id} deleted.`, 'info');
                }
            };

            const handleTransmit = (id) => {
                setLoading(true);
                setTimeout(() => {
                    setInvoices(invoices.map(inv => inv.id === id ? { ...inv, status: "Transmitted (Peppol)" } : inv));
                    setLoading(false);
                    showToast(`Invoice ${id} successfully routed via SG InvoiceNow Access Point!`);
                }, 700);
            };

            const handleEditClick = (id) => {
                setEditId(id);
                setCurrentRoute('edit');
            };

            const editItem = invoices.find(i => i.id === editId);

            return (
                <div className="min-h-screen flex flex-col">
                    <Navbar currentRoute={currentRoute} navigate={navigate} />
                    <main className="flex-1">
                        {currentRoute === 'dashboard' && (
                            <DashboardPage 
                                invoices={invoices} 
                                onDelete={handleDelete} 
                                onTransmit={handleTransmit} 
                                onEdit={handleEditClick} 
                                navigate={navigate} 
                                loading={loading} 
                            />
                        )}
                        {currentRoute === 'create' && (
                            <InvoiceFormPage onSave={handleSaveInvoice} navigate={navigate} />
                        )}
                        {currentRoute === 'edit' && (
                            <InvoiceFormPage onSave={handleSaveInvoice} editData={editItem} navigate={navigate} />
                        )}
                    </main>
                    <footer className="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400 mt-12">
                        Singapore InvoiceNow Simulation &bull; Built with React & Tailwind CSS for Group Project
                    </footer>
                    <ToastContainer toast={toast} />
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
